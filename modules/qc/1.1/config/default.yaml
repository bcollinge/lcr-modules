lcr-modules:

    qc:

        inputs:
            # Available wildcards: {seq_type} {genome_build} {sample_id}
            sample_bam: "__UPDATE__"
            sample_bai: "__UPDATE__"

        scratch_subdirectories: []

        options:
            samtools_stat: "" # can specify --remove-dups --remove-overlaps
            samtools_coverage: "" # with the flag -r can specify a particular region of interest in the format chr:start-end, for example -r chr1:1M-12M. Otherwise, coverage is calculated for all contigs in bam header (default).
            QualityScoreDistribution: "--VALIDATION_STRINGENCY LENIENT" # can specify --ALIGNED_READS_ONLY true
            CollectWgsMetrics: "--USE_FAST_ALGORITHM true --VALIDATION_STRINGENCY LENIENT"
            CollectHsMetrics: "--VALIDATION_STRINGENCY LENIENT"
            GetPileupSummaries: ""
            CalculateContamination: ""
            CollectGcBiasMetrics: "--VALIDATION_STRINGENCY LENIENT"
            preseq: ""

        # seq_types that get the preseq complexity figure
        complexity_seq_types: ["genome", "capture", "lpwgs"]
        # seq_types that also get genome-wide GC bias (CollectGcBiasMetrics); capture dropout comes from CollectHsMetrics
        gc_bias_seq_types: ["genome", "lpwgs"]
        # expected distinct fragments (reads if unpaired) are reported at this many fragments, per seq_type, so libraries
        # compare at equal depth
        preseq_fixed_fragments:
            capture: 20000000
            genome: 200000000
            lpwgs: 5000000
        # time limit (GNU timeout duration) on each lc_extrap attempt; past it the curve stays at the observed fragments
        preseq_extrap_timeout: "2h"

        # seq_types that get GetPileupSummaries + CalculateContamination
        contamination_seq_types: ["genome", "capture"]

        # bgzipped, indexed common-SNP VCFs (e.g. population AF 0.01-0.2 within the targets), keyed by the exact
        # genome_build, then baits_regions for capture samples or "_genome" for the rest; contigs must match the reference
        contamination_sites:
            grch37:
                _genome: "__UPDATE__"
            hg38:
                _genome: "__UPDATE__"

        baits_regions:
            grch37: # other grch37-based reference genomes are also supported within this key, e.g. hs37d5
                _default: "https://www.bcgsc.ca/downloads/morinlab/reference/agilent_sureselect_v5_target_regions.grch37.bed"
                # add another key here to specify a custom bed file with baits regions if needed
                # either local path of URL can be specified
            hg38:
                _default: "https://www.bcgsc.ca/downloads/morinlab/reference/agilent_sureselect_v5_target_regions.hg38.bed"

        conda_envs:
            samtools: "{MODSDIR}/envs/samtools-1.9.yaml" # This version is used because for some crams the version 10 has htslib issues on some CentOS servers
            samtools_cov: "{MODSDIR}/envs/samtools-1.10.yaml" # This is needed because the coverage was introduced only in the version 10
            bedtools: "{MODSDIR}/envs/bedtools-2.29.2.yaml"
            gatkR: "{MODSDIR}/envs/gatkR.yaml"
            gatk: "{MODSDIR}/envs/gatk-4.1.8.1.yaml"
            preseq: "{MODSDIR}/envs/preseq-3.2.0.yaml"

        container_envs:
            samtools: "docker://quay.io/biocontainers/samtools:1.9--h10a08f8_12"
            samtools_cov: "docker://quay.io/biocontainers/samtools:1.10--h9402c20_2"
            bedtools: "docker://quay.io/biocontainers/bedtools:2.29.2--hc088bd4_0"
            gatkR: "docker://broadinstitute/gatk:4.2.6.1"
            gatk: "docker://quay.io/biocontainers/gatk4:4.1.8.1--py38_0"
            preseq: "docker://quay.io/biocontainers/preseq:3.2.0--hdcf5f25_6"
            Rscript: "docker://rocker/tidyverse:4.3.3"

        threads:
            samtools_stat: 8
            samtools_coverage: 8
            QualityScoreDistribution: 12
            CollectMetrics: 24
            collect: 2
            contamination: 1


        resources:
            samtools_stat:
                mem_mb: 20000
                samtools_stat: 1
            samtools_coverage:
                mem_mb: 20000
                samtools_coverage: 1
            QualityScoreDistribution:
                mem_mb: 100000
                base_qual: 1
            CollectMetrics:
                mem_mb: 100000
                collect_metrics: 1
            collect:
                mem_mb: 4000
                summary: 1
            contamination:
                mem_mb: 6000
                contamination: 1
            gc_bias:
                mem_mb: 16000
            preseq:
                mem_mb: 16000

        pairing_config:
            genome:
                run_paired_tumours: False
                run_unpaired_tumours_with: "no_normal"
                run_paired_tumours_as_unpaired: True
            capture:
                run_paired_tumours: False
                run_unpaired_tumours_with: "no_normal"
                run_paired_tumours_as_unpaired: True
