lcr-modules:

    mrna_ashm_tally:

        inputs:
            # Available wildcards: {seq_type} {genome_build} {sample_id}
            sample_bam: "__UPDATE__"
            sample_bai: "__UPDATE__"
            tally_script: "{MODSDIR}/src/mrna_ashm_tally.py"

        # Regions to tally, keyed by genome build, then by region name, with
        # "chrom:start-end" 1-based inclusive in that build's coordinates. Every
        # position in every region is reported, so a region should be a locus of
        # interest rather than a whole chromosome. Every build present in the
        # samples needs an entry, and the module fails at setup if one is absent.
        regions: {}

        options:
            # reads below these are excluded from the counts; a base is only
            # counted where both pass
            min_mapq: 1
            min_baseq: 10
            max_depth: 100000

        conda_envs:
            pysam: "{MODSDIR}/envs/pysam-0.21.0.yaml"

        threads:
            tally: 1
            aggregate: 1

        resources:
            tally:
                mem_mb: 4000
            aggregate:
                mem_mb: 16000

        pairing_config:
            mrna:
                run_paired_tumours: False
                run_unpaired_tumours_with: "no_normal"
                run_paired_tumours_as_unpaired: True
