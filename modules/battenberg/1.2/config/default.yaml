lcr-modules:
    battenberg:
        inputs:
            # Available wildcards: {seq_type} {genome_build} {sample_id}
            sample_bam: "__UPDATE__"
            battenberg_script: "{MODSDIR}/src/battenberg_wgs_hg38.R"
            cnv2igv: "{SCRIPTSDIR}/cnv2igv/1.5/cnv2igv.py"
            src_dir: "{MODSDIR}/src/"
            # Path to a directory containing pre-downloaded Battenberg reference files,
            # with one subdirectory per genome build (e.g. reference_path/hg38/impute_info.txt).
            # If set, the download rule (_battenberg_get_reference) is bypassed entirely.
            # If null (default), references are downloaded to 00-inputs/reference/ on first run.
            reference_path: null

        # specify in which projections you want the output files
        requested_projections: ["grch37", "hg38"]

        scratch_subdirectories: []

        conda_envs:
            battenberg: "{MODSDIR}/envs/battenberg-1.1.yaml"
            wget: "{MODSDIR}/envs/wget-1.20.1.yaml"
            samtools: "{MODSDIR}/envs/samtools-1.9.yaml"
            bedtools: "{MODSDIR}/envs/bedtools-2.29.2.yaml"
            cnv2igv: "{SCRIPTSDIR}/cnv2igv/1.5/python-3.8.3.yaml"
            liftover: "{SCRIPTSDIR}/liftover/2.0/liftover.yaml"

        container_envs:
            battenberg: "docker://ghcr.io/lcr-bccrc/lcr-scripts/battenberg:1.2"
            wget: null
            samtools: "docker://quay.io/biocontainers/samtools:1.9--h10a08f8_12"
            bedtools: "docker://ghcr.io/lcr-bccrc/lcr-scripts/fill_segments:1.1"
            cnv2igv: null
            liftover: "docker://ghcr.io/lcr-bccrc/lcr-scripts/liftover:1.0"

        options:
            # cnv2igv preserve log.ratio or change this to "" to calculate it from the absolute CN
            preserve: "--preserve_log_ratio"
            liftover_script_path: "{SCRIPTSDIR}/liftover/2.0/liftover.sh"
            liftover_minMatch: "0.95" # Float number from 0 to 1 indicating minimal mapping when converting to a different genome build
            fill_segments_version: "1.2/"

        resources:
            battenberg:
                mem_mb: 200000
                bam: 1
            infer_sex:
                mem_mb: 20000
                bam: 1
            reference:
                mem_mb: 8000
            post_battenberg:
                mem_mb: 2000
                bam: 1

        threads:
            battenberg: 24
            reference: 2
            #ideal for processing all chromosomes at once

        pairing_config:
            genome:
                run_paired_tumours: True
                run_unpaired_tumours_with: null
                run_paired_tumours_as_unpaired: False
            capture:
                run_paired_tumours: True
                run_unpaired_tumours_with: null
                run_paired_tumours_as_unpaired: False
